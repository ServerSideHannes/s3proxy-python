# Baked default: serves the static dashboard under /dashboard with SPA fallback.
# This is the fallback for running the image standalone. In the Helm chart this
# file is replaced by a mounted ConfigMap that also reverse-proxies /dashboard/api
# (JSON + SSE) and the auth endpoints to the proxy service, making the dashboard
# single-origin. Standalone, point /dashboard/api at your proxy yourself (or use the
# chart). dashboard.path is /dashboard here to match the build's baked-in base path.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Hashed, immutable build assets.
    location /dashboard/_app/ {
        alias /usr/share/nginx/html/_app/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else under /dashboard falls back to the SPA shell so client-side
    # hash routing (and the /dashboard/login page) works on hard refresh.
    location /dashboard {
        try_files $uri /index.html;
    }

    location = / {
        return 302 /dashboard;
    }
}
