# S3Proxy Helm Chart Values

replicaCount: 3

image:
  repository: ghcr.io/ServerSideHannes/s3proxy-python
  tag: latest
  pullPolicy: IfNotPresent

s3:
  host: "s3.amazonaws.com"
  region: "us-east-1"

server:
  port: 4433
  noTls: true
  # Serve HTTPS directly from the proxy pod (instead of, or in addition to,
  # terminating TLS at the ingress). Point `tls.existingSecret` at an existing
  # `kubernetes.io/tls` Secret holding `tls.crt` / `tls.key`; it is mounted into
  # the pod at `certPath` and the proxy terminates TLS itself. When set, `noTls`
  # is forced off, probes switch to HTTPS, the dashboard session cookie is marked
  # Secure, and the dashboard's nginx talks to the proxy over HTTPS.
  tls:
    existingSecret: ""
  certPath: "/etc/s3proxy/certs"

performance:
  memoryLimitMb: 64

# Redis holds only transient multipart-upload state (TTL'd, deleted on
# completion). It is NOT a durable store — losing it only forces in-flight
# multipart uploads to restart, never any committed object. So a single
# bundled Redis pod is the sensible default; for HA or shared infra, disable
# this and point `externalRedis.url` at your own Redis.
redis:
  enabled: true
  image:
    # NOTE: not auto-bumped by dependabot (it doesn't track image tags in
    # values.yaml). Bump this tag manually when upgrading Redis.
    repository: redis
    tag: "8"
    pullPolicy: IfNotPresent
  port: 6379
  # maxmemory-policy noeviction so the proxy gets an error rather than silent
  # eviction of in-flight upload state.
  maxmemory: "200mb"
  maxmemoryPolicy: "noeviction"
  # Optional auth. Off by default (in-cluster ClusterIP, transient data).
  # Set `password`, or point `existingSecret`/`passwordKey` at your own Secret.
  auth:
    enabled: false
    password: ""
    existingSecret: ""
    passwordKey: "redis-password"
  # Persistence. Off by default — Redis here holds only transient, TTL'd upload
  # state, so an emptyDir is the sensible default. Enable to back /data with a
  # PVC so that state survives pod restarts/rescheduling.
  persistence:
    enabled: false
    size: "1Gi"
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# External Redis — used when `redis.enabled: false`. Point at a Redis you run
# yourself (managed service, shared cluster, your own HA setup).
externalRedis:
  url: ""
  uploadTtlHours: 24
  existingSecret: ""
  passwordKey: "redis-password"

secrets:
  existingSecrets:
    enabled: false
    name: ""
    keys:
      credentials: "S3PROXY_CREDENTIALS"

  # AWS credentials, each with its own encryption key (KEK). The proxy verifies
  # a client's signature with secretKey, then encrypts/decrypts that credential's
  # objects with the KEK derived from kek. Rendered into the S3PROXY_CREDENTIALS
  # secret as a JSON array. At least one entry is required.
  credentials: []
  # - accessKey: "AKIAEXAMPLE"
  #   secretKey: "wJalr...EXAMPLEKEY"
  #   kek: "a-long-random-kek-secret"

logLevel: "DEBUG"

# Dashboard. The proxy serves the dashboard API (JSON + SSE) and form auth under
# `dashboard.path` when enabled. The UI itself is a Svelte static build served by
# its own Deployment (`dashboard.frontend`); that pod's nginx reverse-proxies the
# API + auth to the proxy, so the dashboard is single-origin behind one service.
# Credentials are stored in a Secret. Override username/password in production,
# or point existingSecret at your own Secret holding the credential keys below.
dashboard:
  enabled: false
  path: "/dashboard"
  username: "admin"
  password: "admin"
  existingSecret:
    name: ""
    usernameKey: "S3PROXY_DASHBOARD_USERNAME"
    passwordKey: "S3PROXY_DASHBOARD_PASSWORD"

  # Login methods. At least one must be enabled. Disable `password` to make the
  # dashboard SSO-only (then `username`/`password` above are unused).
  auth:
    password:
      enabled: true
    # OIDC single sign-on (JumpCloud, Okta, Google, Entra ID, ...). Generic
    # OpenID Connect authorization-code flow with PKCE — the issuer's discovery
    # document drives the endpoints, so any compliant provider works. For
    # JumpCloud: create an OIDC application, set the redirect URI to
    # `<dashboard-url>/dashboard/api/oidc/callback`, and use issuer
    # `https://oauth.id.jumpcloud.com/`.
    oidc:
      enabled: false
      issuer: ""
      clientId: ""
      clientSecret: ""
      # Full external callback URL. Leave empty to derive it from the incoming
      # request (uses X-Forwarded-Proto/Host). Set explicitly when the dashboard
      # sits behind a proxy that rewrites the host.
      redirectUrl: ""
      scopes: "openid email profile"
      # ID-token claim used as the session username.
      usernameClaim: "email"
      # Comma-separated email-domain allowlist (empty = any authenticated user).
      allowedDomains: ""
      buttonLabel: "Sign in with SSO"
      # Provide the client secret via your own Secret instead of `clientSecret`.
      existingSecret:
        name: ""
        clientSecretKey: "S3PROXY_DASHBOARD_OIDC_CLIENT_SECRET"

  # Separate Deployment serving the Svelte dashboard (the static build from
  # dashboard-frontend/), with an nginx that also reverse-proxies the API.
  frontend:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/serversidehannes/s3proxy-dashboard
      tag: "latest"
      pullPolicy: IfNotPresent
    containerPort: 8080
    service:
      port: 80
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
    nodeSelector: {}
    affinity: {}
    tolerations: []

  # Optional dedicated Ingress for the dashboard. OFF by default — the dashboard
  # should not be internet-facing unless you explicitly expose it (ideally behind
  # an internal ingress class, an IP allowlist, or VPN). Routes `dashboard.path`
  # to the dashboard Deployment. Set `className` to whatever ingress controller
  # your cluster runs.
  ingress:
    enabled: false
    # "Ingress" (standard) or "IngressRoute" (Traefik CRD).
    kind: Ingress
    className: ""
    annotations: {}
    host: ""
    tls: []  # e.g. [{ secretName: dashboard-tls, hosts: [dashboard.example.com] }]
    # Traefik IngressRoute only:
    entryPoints: []   # e.g. [websecure]
    middlewares: []   # e.g. [{ name: my-mw }]

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 4433

# Bundled front proxy (HAProxy) for even load distribution across s3proxy pods.
# A plain ClusterIP balances per-connection (L4), so S3 clients holding long-lived
# keep-alive connections pin to a single pod. The front proxy balances per-request
# (L7) across all pods, fanning out even a single client's stream. Self-contained:
# requires nothing else in the cluster. OFF by default — clients then talk to the
# front proxy Service (`s3proxy-python-frontproxy`) instead of the s3proxy Service.
frontproxy:
  enabled: false
  replicaCount: 2
  image:
    repository: haproxy
    tag: "3.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # Port HAProxy binds inside the container. Must be > 1024: the container runs
  # as non-root with all capabilities dropped, so it cannot bind a privileged
  # port (e.g. 80). The Service still exposes `service.port` and targets this.
  containerPort: 8080
  # Per-request timeouts must tolerate large S3 transfers.
  timeouts:
    client: "1h"
    server: "1h"
    connect: "10s"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Optional Ingress to expose S3 operations OUTSIDE the cluster. Routes to the
# front proxy, so external clients also get even per-request distribution —
# therefore requires `frontproxy.enabled: true`. Controller-agnostic: set
# `className` to whatever ingress controller your cluster runs, and add any
# controller-specific tuning (buffering, body size, timeouts) via `annotations`.
ingress:
  enabled: false
  # "Ingress" (standard) or "IngressRoute" (Traefik CRD).
  kind: Ingress
  className: ""
  annotations: {}
  hosts: []
  # - host: s3.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - secretName: s3-tls
  #   hosts: [s3.example.com]
  # Traefik IngressRoute only:
  entryPoints: []   # e.g. [websecure]
  middlewares: []   # e.g. [{ name: my-mw }]

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# Pod Disruption Budget - ensures HA during node maintenance/upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable