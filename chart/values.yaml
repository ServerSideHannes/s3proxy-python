# S3Proxy Helm Chart Values

replicaCount: 3

image:
  repository: ghcr.io/ServerSideHannes/s3proxy-python
  tag: latest
  pullPolicy: IfNotPresent

s3:
  host: "s3.amazonaws.com"
  region: "us-east-1"

server:
  port: 4433
  noTls: true

performance:
  memoryLimitMb: 64

# Redis holds only transient multipart-upload state (TTL'd, deleted on
# completion). It is NOT a durable store — losing it only forces in-flight
# multipart uploads to restart, never any committed object. So a single
# bundled Redis pod is the sensible default; for HA or shared infra, disable
# this and point `externalRedis.url` at your own Redis.
redis:
  enabled: true
  image:
    # NOTE: not auto-bumped by dependabot (it doesn't track image tags in
    # values.yaml). Bump this tag manually when upgrading Redis.
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  # maxmemory-policy noeviction so the proxy gets an error rather than silent
  # eviction of in-flight upload state.
  maxmemory: "200mb"
  maxmemoryPolicy: "noeviction"
  # Optional auth. Off by default (in-cluster ClusterIP, transient data).
  # Set `password`, or point `existingSecret`/`passwordKey` at your own Secret.
  auth:
    enabled: false
    password: ""
    existingSecret: ""
    passwordKey: "redis-password"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# External Redis — used when `redis.enabled: false`. Point at a Redis you run
# yourself (managed service, shared cluster, your own HA setup).
externalRedis:
  url: ""
  uploadTtlHours: 24
  existingSecret: ""
  passwordKey: "redis-password"

secrets:
  existingSecrets:
    enabled: false
    name: ""
    keys:
      credentials: "S3PROXY_CREDENTIALS"

  # AWS credentials, each with its own encryption key (KEK). The proxy verifies
  # a client's signature with secretKey, then encrypts/decrypts that credential's
  # objects with the KEK derived from kek. Rendered into the S3PROXY_CREDENTIALS
  # secret as a JSON array. At least one entry is required.
  credentials: []
  # - accessKey: "AKIAEXAMPLE"
  #   secretKey: "wJalr...EXAMPLEKEY"
  #   kek: "a-long-random-kek-secret"

logLevel: "DEBUG"

# Admin dashboard — served on the main service port at `admin.path`.
# Credentials are stored in a Secret. Override username/password in production,
# or point existingSecret at your own Secret holding the credential keys below.
admin:
  enabled: false
  path: "/admin"
  username: "admin"
  password: "admin"
  # Stable secret used to sign admin session cookies. Required when enabled.
  # Override in production; keep it stable so sessions survive pod restarts.
  secret: "change-me"
  existingSecret:
    name: ""
    usernameKey: "S3PROXY_ADMIN_USERNAME"
    passwordKey: "S3PROXY_ADMIN_PASSWORD"
    secretKey: "S3PROXY_ADMIN_SECRET"

  # Optional dedicated Ingress for the dashboard. OFF by default — the admin UI
  # should not be internet-facing unless you explicitly expose it (ideally behind
  # an internal ingress class, an IP allowlist, or VPN). Routes `admin.path` to the
  # proxy service. Set `className` to whatever ingress controller your cluster runs.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []  # e.g. [{ secretName: admin-tls, hosts: [admin.example.com] }]

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 4433

# Bundled front proxy (HAProxy) for even load distribution across s3proxy pods.
# A plain ClusterIP balances per-connection (L4), so S3 clients holding long-lived
# keep-alive connections pin to a single pod. The front proxy balances per-request
# (L7) across all pods, fanning out even a single client's stream. Self-contained:
# requires nothing else in the cluster. OFF by default — clients then talk to the
# front proxy Service (`s3proxy-python-frontproxy`) instead of the s3proxy Service.
frontproxy:
  enabled: false
  replicaCount: 2
  image:
    repository: haproxy
    tag: "3.0-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # Per-request timeouts must tolerate large S3 transfers.
  timeouts:
    client: "1h"
    server: "1h"
    connect: "10s"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Optional Ingress to expose S3 operations OUTSIDE the cluster. Routes to the
# front proxy, so external clients also get even per-request distribution —
# therefore requires `frontproxy.enabled: true`. Controller-agnostic: set
# `className` to whatever ingress controller your cluster runs, and add any
# controller-specific tuning (buffering, body size, timeouts) via `annotations`.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: s3.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - secretName: s3-tls
  #   hosts: [s3.example.com]

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# Pod Disruption Budget - ensures HA during node maintenance/upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable