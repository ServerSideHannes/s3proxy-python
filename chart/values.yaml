# S3Proxy Helm Chart Values

replicaCount: 3

image:
  repository: ghcr.io/ServerSideHannes/s3proxy-python
  tag: latest
  pullPolicy: IfNotPresent

s3:
  host: "s3.amazonaws.com"
  region: "us-east-1"

server:
  port: 4433
  noTls: true

performance:
  memoryLimitMb: 64

externalRedis:
  url: ""
  uploadTtlHours: 24
  existingSecret: ""
  passwordKey: "redis-password"

redis-ha:
  enabled: true
  replicas: 1
  auth: false
  redisPassword: ""
  existingSecret: ""
  authKey: "auth"

  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: ""

  haproxy:
    enabled: true
    replicas: 2
    # CRITICAL: Health check and timeout settings for high load tolerance
    # Redis can be slow during BGSAVE - don't mark as DOWN too quickly
    checkInterval: 5s         # Check every 5 seconds (default: 1s)
    timeout:
      check: "10s"            # Wait 10s for health check response (default: 2s)
      server: "60s"           # Server response timeout (default: 30s)
      client: "60s"           # Client connection timeout (default: 30s)
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  sentinel:
    port: 26379
    quorum: 2
    config:
      down-after-milliseconds: 10000
      failover-timeout: 180000
      parallel-syncs: 5

  redis:
    port: 6379
    config:
      maxmemory: "200mb"
      maxmemory-policy: noeviction

      min-replicas-to-write: 2
      min-replicas-max-lag: 10

  hardAntiAffinity: true

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

secrets:
  existingSecrets:
    enabled: false
    name: ""
    keys:
      credentials: "S3PROXY_CREDENTIALS"

  # AWS logins, each with its own encryption key (KEK). The proxy verifies a
  # client's signature with secretKey, then encrypts/decrypts that login's
  # objects with the KEK derived from kek. Rendered into the S3PROXY_CREDENTIALS
  # secret as a JSON array. At least one entry is required.
  credentials: []
  # - accessKey: "AKIAEXAMPLE"
  #   secretKey: "wJalr...EXAMPLEKEY"
  #   kek: "a-long-random-kek-secret"

logLevel: "DEBUG"

# Admin dashboard — served on the main service port at `admin.path`.
# Credentials are stored in a Secret. Override username/password in production,
# or point existingSecret at your own Secret holding the credential keys below.
admin:
  enabled: false
  path: "/admin"
  username: "admin"
  password: "admin"
  # Stable secret used to sign admin session cookies. Required when enabled.
  # Override in production; keep it stable so logins survive pod restarts.
  secret: "change-me"
  existingSecret:
    name: ""
    usernameKey: "S3PROXY_ADMIN_USERNAME"
    passwordKey: "S3PROXY_ADMIN_PASSWORD"
    secretKey: "S3PROXY_ADMIN_SECRET"

  # Optional dedicated Ingress for the dashboard, separate from the S3 data-plane
  # ingress above. OFF by default — the admin UI should not be internet-facing
  # unless you explicitly expose it (ideally behind an internal ingress class,
  # an IP allowlist, or VPN). Routes `admin.path` to the proxy service.
  ingress:
    enabled: false
    className: "nginx"
    host: ""
    annotations: {}
    tls: []  # e.g. [{ secretName: admin-tls, hosts: [admin.example.com] }]

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 4433

gateway:
  enabled: false
  serviceName: s3-gateway
  ingressService: ingress-nginx-controller.ingress-nginx.svc.cluster.local

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# Pod Disruption Budget - ensures HA during node maintenance/upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  tls: []
  hosts: []