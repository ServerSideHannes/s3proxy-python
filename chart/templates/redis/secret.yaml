{{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{- if not .Values.redis.auth.password }}
{{- fail "redis.auth.enabled is true but redis.auth.password is empty — set a password or point redis.auth.existingSecret at your own Secret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-redis
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  {{ .Values.redis.auth.passwordKey }}: {{ .Values.redis.auth.password | quote }}
{{- end }}
