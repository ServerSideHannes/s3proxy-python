{{- if and .Values.dashboard.enabled .Values.dashboard.frontend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-dashboard
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    {{- include "s3proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.frontend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
