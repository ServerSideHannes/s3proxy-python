apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s3proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s3proxy.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          {{- if not .Values.secrets.existingSecrets.enabled }}
            - secretRef:
                name: {{ printf "%s-secrets" .Chart.Name }}
          {{- end }}
          {{- /* Admin creds need an explicit env block only when they are NOT already
                 pulled in via the chart-secret envFrom above (i.e. an admin existingSecret
                 is set, or the app uses an existing secret so envFrom never fires). */ -}}
          {{- $adminFromChartSecret := and .Values.admin.enabled (not .Values.admin.existingSecret.name) (not .Values.secrets.existingSecrets.enabled) }}
          {{- $adminNeedsEnv := and .Values.admin.enabled (not $adminFromChartSecret) }}
          {{- /* Determine if we need env section */ -}}
          {{- $needsEnv := or .Values.secrets.existingSecrets.enabled $adminNeedsEnv (and (index .Values "redis-ha" "enabled") (index .Values "redis-ha" "auth")) (and (not (index .Values "redis-ha" "enabled")) .Values.externalRedis.existingSecret) }}
          {{- if $needsEnv }}
          env:
            {{- /* App secrets from existing secret */ -}}
            {{- if .Values.secrets.existingSecrets.enabled }}
            - name: S3PROXY_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecrets.name }}
                  key: {{ .Values.secrets.existingSecrets.keys.encryptKey }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecrets.name }}
                  key: {{ .Values.secrets.existingSecrets.keys.awsAccessKeyId }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecrets.name }}
                  key: {{ .Values.secrets.existingSecrets.keys.awsSecretAccessKey }}
            {{- end }}
            {{- /* Admin dashboard credentials (when not pulled via the chart-secret envFrom) */ -}}
            {{- if $adminNeedsEnv }}
            {{- $adminSecret := .Values.admin.existingSecret.name | default (printf "%s-secrets" .Chart.Name) }}
            - name: S3PROXY_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: {{ .Values.admin.existingSecret.usernameKey }}
            - name: S3PROXY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: {{ .Values.admin.existingSecret.passwordKey }}
            {{- end }}
            {{- /* Redis password from redis-ha secret */ -}}
            {{- if and (index .Values "redis-ha" "enabled") (index .Values "redis-ha" "auth") }}
            - name: S3PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if index .Values "redis-ha" "existingSecret" }}
                  name: {{ index .Values "redis-ha" "existingSecret" }}
                  {{- else }}
                  name: {{ .Release.Name }}-redis-ha
                  {{- end }}
                  key: {{ index .Values "redis-ha" "authKey" | default "auth" }}
            {{- /* Redis password from external Redis secret */ -}}
            {{- else if and (not (index .Values "redis-ha" "enabled")) .Values.externalRedis.existingSecret }}
            - name: S3PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRedis.existingSecret }}
                  key: {{ .Values.externalRedis.passwordKey | default "redis-password" }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
