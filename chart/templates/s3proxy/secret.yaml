{{- $createApp := not .Values.secrets.existingSecrets.enabled -}}
{{- $createDashboard := and .Values.dashboard.enabled (not .Values.dashboard.existingSecret.name) -}}
{{- if or $createApp $createDashboard }}
# Creating static secrets (provide via helm --set or secure values file, not hardcoded)
# Secret keys created: S3PROXY_CREDENTIALS, and (when the dashboard is enabled)
# S3PROXY_DASHBOARD_USERNAME / S3PROXY_DASHBOARD_PASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $createApp }}
  {{- $creds := list }}
  {{- range .Values.secrets.credentials }}
  {{- $creds = append $creds (dict "access_key" .accessKey "secret_key" .secretKey "kek" .kek) }}
  {{- end }}
  S3PROXY_CREDENTIALS: {{ toJson $creds | quote }}
  {{- end }}
  {{- if $createDashboard }}
  S3PROXY_DASHBOARD_USERNAME: {{ .Values.dashboard.username | quote }}
  S3PROXY_DASHBOARD_PASSWORD: {{ .Values.dashboard.password | quote }}
  {{- end }}
{{- end }}
