{{- $createApp := not .Values.secrets.existingSecrets.enabled -}}
{{- $pwEnabled := .Values.dashboard.auth.password.enabled -}}
{{- $createPw := and .Values.dashboard.enabled $pwEnabled (not .Values.dashboard.existingSecret.name) -}}
{{- $oidc := .Values.dashboard.auth.oidc -}}
{{- $createOidc := and .Values.dashboard.enabled $oidc.enabled (not $oidc.existingSecret.name) -}}
{{- if or $createApp $createPw $createOidc }}
# Creating static secrets (provide via helm --set or secure values file, not hardcoded)
# Secret keys created: S3PROXY_CREDENTIALS, and (when enabled) the dashboard
# username/password and/or the OIDC client secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $createApp }}
  {{- $creds := list }}
  {{- range .Values.secrets.credentials }}
  {{- $creds = append $creds (dict "access_key" .accessKey "secret_key" .secretKey "kek" .kek) }}
  {{- end }}
  S3PROXY_CREDENTIALS: {{ toJson $creds | quote }}
  {{- end }}
  {{- if $createPw }}
  S3PROXY_DASHBOARD_USERNAME: {{ .Values.dashboard.username | quote }}
  S3PROXY_DASHBOARD_PASSWORD: {{ .Values.dashboard.password | quote }}
  {{- end }}
  {{- if $createOidc }}
  S3PROXY_DASHBOARD_OIDC_CLIENT_SECRET: {{ $oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
