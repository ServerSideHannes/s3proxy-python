{{- if .Values.ingress.enabled -}}
{{- if not .Values.frontproxy.enabled }}
{{- fail "ingress.enabled requires frontproxy.enabled=true — the ingress routes to the front proxy" }}
{{- end }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.enabled is true but ingress.hosts is empty — set at least one host" }}
{{- end }}
{{- if eq .Values.ingress.kind "IngressRoute" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    {{- range .Values.ingress.hosts }}
    {{- $host := .host }}
    {{- range .paths }}
    - match: Host(`{{ $host }}`) && PathPrefix(`{{ .path }}`)
      kind: Rule
      {{- with $.Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $.Chart.Name }}-frontproxy
          port: {{ $.Values.frontproxy.service.port }}
    {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    secretName: {{ (first .).secretName }}
  {{- end }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Chart.Name }}-frontproxy
                port:
                  number: {{ $.Values.frontproxy.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
