apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s3proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s3proxy.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          {{- if not .Values.secrets.existingSecrets.enabled }}
            - secretRef:
                name: {{ printf "%s-secrets" .Chart.Name }}
          {{- end }}
          {{- /* Dashboard creds need an explicit env block only when they are NOT already
                 pulled in via the chart-secret envFrom above (i.e. an dashboard existingSecret
                 is set, or the app uses an existing secret so envFrom never fires). */ -}}
          {{- $dashboardFromChartSecret := and .Values.dashboard.enabled (not .Values.dashboard.existingSecret.name) (not .Values.secrets.existingSecrets.enabled) }}
          {{- $dashboardNeedsEnv := and .Values.dashboard.enabled (not $dashboardFromChartSecret) }}
          {{- /* Redis password is needed when the bundled Redis has auth on, or
                 external Redis is used with an existing secret. */ -}}
          {{- $redisAuth := and .Values.redis.enabled .Values.redis.auth.enabled }}
          {{- $extRedisAuth := and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
          {{- /* Determine if we need env section */ -}}
          {{- $needsEnv := or .Values.secrets.existingSecrets.enabled $dashboardNeedsEnv $redisAuth $extRedisAuth }}
          {{- if $needsEnv }}
          env:
            {{- /* App secrets from existing secret */ -}}
            {{- if .Values.secrets.existingSecrets.enabled }}
            - name: S3PROXY_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecrets.name }}
                  key: {{ .Values.secrets.existingSecrets.keys.credentials }}
            {{- end }}
            {{- /* Dashboard credentials (when not pulled via the chart-secret envFrom) */ -}}
            {{- if $dashboardNeedsEnv }}
            {{- $dashboardSecret := .Values.dashboard.existingSecret.name | default (printf "%s-secrets" .Chart.Name) }}
            - name: S3PROXY_DASHBOARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dashboardSecret }}
                  key: {{ .Values.dashboard.existingSecret.usernameKey }}
            - name: S3PROXY_DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dashboardSecret }}
                  key: {{ .Values.dashboard.existingSecret.passwordKey }}
            {{- end }}
            {{- /* Redis password from the bundled Redis secret */ -}}
            {{- if $redisAuth }}
            - name: S3PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default (printf "%s-redis" .Chart.Name) }}
                  key: {{ .Values.redis.auth.passwordKey }}
            {{- /* Redis password from external Redis secret */ -}}
            {{- else if $extRedisAuth }}
            - name: S3PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRedis.existingSecret }}
                  key: {{ .Values.externalRedis.passwordKey | default "redis-password" }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
