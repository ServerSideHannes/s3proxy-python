version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # aioboto3 (latest 15.5.0) pins aiobotocore==2.25.1, which caps
      # botocore <1.40.62. boto3/botocore release far ahead of that, so
      # bumping them independently makes resolution unsatisfiable. Let
      # aioboto3 drive their versions; revisit when a newer aioboto3 ships.
      - dependency-name: "boto3"
      - dependency-name: "botocore"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "helm"
    directory: "/chart"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      helm:
        applies-to: version-updates
        patterns:
          - "*"
      helm-security:
        applies-to: security-updates
        patterns:
          - "*"
