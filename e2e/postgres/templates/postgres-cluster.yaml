apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  storage:
    size: 20Gi

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"

  backup:
    barmanObjectStore:
      destinationPath: "s3://postgres-backups/"
      endpointURL: "http://s3proxy-python-frontproxy.s3proxy:80"
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        # Compression intentionally OFF: pgbench data is highly compressible, so
        # gzip would shrink the backup below one 512MB chunk and we'd never get
        # concurrent large uploads. Uncompressed, the dataset spans several 512MB
        # chunks which (with jobs=4) reproduces the multipart-upload OOM.
        # 4 parallel upload jobs pushing 512MB chunks mirrors production.
        jobs: 4
        additionalCommandArgs:
          - "--min-chunk-size=512MB"
    retentionPolicy: "7d"
